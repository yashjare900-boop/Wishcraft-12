<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{WISH_TITLE}} — WishCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root {
  --bg-primary: #07090e;
  --theme: {{THEME_COLOR}};
  --theme-glow: {{THEME_COLOR}}33;
  --gold: #d4af6a;
  --cream: #f6f3eb;
  --cream-dim: rgba(246,243,235,0.7);
  --glass-bg: rgba(18, 22, 32, 0.65);
  --glass-border: rgba(255, 255, 255, 0.12);
  --font-serif: 'Fraunces', Georgia, serif;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background-color: var(--bg-primary);
  color: var(--cream);
  font-family: var(--font-sans);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}

/* Atmospheric Ambient Glow */
.ambient-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.glow-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.28;
  animation: floatOrb 18s ease-in-out infinite alternate;
}
.orb-1 { width: 450px; height: 450px; background: var(--theme); top: -10%; left: -10%; }
.orb-2 { width: 500px; height: 500px; background: #6c5ce7; bottom: -15%; right: -10%; animation-delay: -7s; }
.orb-3 { width: 350px; height: 350px; background: #d4af6a; top: 40%; left: 60%; animation-delay: -12s; opacity: 0.15; }

@keyframes floatOrb {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(40px, 30px) scale(1.1); }
  100% { transform: translate(-30px, 50px) scale(0.95); }
}

/* Container */
.wc-viewport {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 680px;
  min-height: 100vh;
  padding: 40px 20px 80px 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* Scene System */
.wc-scene {
  width: 100%;
  display: none;
  opacity: 0;
  transform: translateY(20px) scale(0.98);
  transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.wc-scene.active {
  display: flex;
  flex-direction: column;
  align-items: center;
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* Frosted Glass Card */
.glass-card {
  width: 100%;
  background: var(--glass-bg);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid var(--glass-border);
  border-radius: 28px;
  padding: 40px 32px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
  text-align: center;
  position: relative;
  overflow: hidden;
}

/* Top Badge */
.occasion-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.14);
  padding: 6px 16px;
  border-radius: 30px;
  font-size: 12px;
  font-family: var(--font-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 24px;
}

/* Typography */
.hero-title {
  font-family: var(--font-serif);
  font-size: clamp(32px, 6vw, 44px);
  font-weight: 600;
  line-height: 1.15;
  color: #ffffff;
  margin-bottom: 14px;
  letter-spacing: -0.02em;
}
.hero-subtitle {
  font-size: clamp(14px, 2.5vw, 16px);
  color: var(--cream-dim);
  line-height: 1.6;
  max-width: 480px;
  margin: 0 auto 32px auto;
  font-weight: 300;
}

/* Interactive Candle Blow Out */
.candle-stage {
  position: relative;
  width: 120px;
  height: 170px;
  margin: 20px auto 36px auto;
  cursor: pointer;
}
.candle-stick {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 90px;
  background: linear-gradient(180deg, #f6f3eb, #e0d8c3);
  border-radius: 6px 6px 4px 4px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}
.candle-wick {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  width: 3px;
  height: 14px;
  background: #333;
  border-radius: 2px;
}
.candle-flame {
  position: absolute;
  top: -34px;
  left: 50%;
  transform: translateX(-50%);
  width: 18px;
  height: 30px;
  background: linear-gradient(180deg, #ffffff 10%, #ffd32a 40%, #ff5e57 90%);
  border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
  box-shadow: 0 0 35px #ffd32a, 0 0 60px rgba(255, 94, 87, 0.6);
  animation: flicker 1.4s ease-in-out infinite alternate;
  transform-origin: 50% 90%;
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.candle-flame.extinguished {
  opacity: 0;
  transform: translateX(-50%) scale(0.2);
}
.candle-smoke {
  position: absolute;
  top: -45px;
  left: 50%;
  transform: translateX(-50%);
  width: 8px;
  height: 25px;
  opacity: 0;
  background: rgba(255,255,255,0.4);
  filter: blur(4px);
  border-radius: 50%;
  pointer-events: none;
}
.candle-smoke.rise {
  animation: riseSmoke 1.8s forwards;
}

@keyframes flicker {
  0% { transform: translateX(-50%) rotate(-2deg) scale(1); }
  50% { transform: translateX(-50%) rotate(2deg) scale(1.05); }
  100% { transform: translateX(-50%) rotate(-1deg) scale(0.95); }
}
@keyframes riseSmoke {
  0% { opacity: 0.6; transform: translateX(-50%) translateY(0) scale(1); }
  100% { opacity: 0; transform: translateX(-50%) translateY(-50px) scale(3.5); }
}

/* Primary Button */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: linear-gradient(135deg, var(--theme), #d4af6a);
  color: #07090e;
  font-weight: 600;
  font-size: 14.5px;
  padding: 14px 32px;
  border-radius: 40px;
  border: none;
  cursor: pointer;
  box-shadow: 0 10px 30px var(--theme-glow);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 36px var(--theme-glow);
}
.btn-primary:active { transform: translateY(0); }

/* Prose Letter */
.wc-prose-container {
  text-align: left;
  line-height: 1.8;
  font-size: 15px;
  color: var(--cream);
  margin-bottom: 28px;
}
.wc-prose-p {
  margin-bottom: 18px;
  font-weight: 300;
}
.wc-prose-p:last-child { margin-bottom: 0; }

.wc-quote-box {
  background: rgba(255,255,255,0.03);
  border-left: 2px solid var(--theme);
  padding: 16px 20px;
  border-radius: 0 14px 14px 0;
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 15px;
  color: #fff;
  margin: 24px 0;
}

.signature-block {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  font-family: var(--font-serif);
  font-size: 16px;
  color: var(--gold);
  margin-top: 24px;
}

/* Photo Gallery Strip */
.photos-strip {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding: 10px 0 20px 0;
  width: 100%;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.photos-strip::-webkit-scrollbar { display: none; }
.photo-thumb {
  width: 130px;
  height: 170px;
  object-fit: cover;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.15);
  flex-shrink: 0;
  box-shadow: 0 8px 20px rgba(0,0,0,0.5);
  transition: transform 0.3s ease;
}
.photo-thumb:hover { transform: scale(1.04); }

/* Watermark Pill */
.wc-watermark {
  margin-top: 40px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 20px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  font-size: 11px;
  color: var(--cream-dim);
  text-decoration: none;
  transition: opacity 0.2s;
}
.wc-watermark:hover { opacity: 0.8; }
.wc-watermark span { color: var(--gold); font-weight: 600; }
</style>
</head>
<body>

<div class="ambient-glow">
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="glow-orb orb-3"></div>
</div>

<main class="wc-viewport">
  
  <!-- SCENE 1: HERO & CANDLE WISH -->
  <section id="sceneHero" class="wc-scene active">
    <div class="glass-card">
      <div class="occasion-badge">✨ A Celestial Birthday Wish</div>
      <h1 class="hero-title">{{WISH_TITLE}}</h1>
      <p class="hero-subtitle">{{WISH_SUBTITLE}}</p>

      <div class="candle-stage" id="candleStage" title="Tap to blow out the candle and make a wish">
        <div class="candle-flame" id="candleFlame"></div>
        <div class="candle-wick"></div>
        <div class="candle-stick"></div>
        <div class="candle-smoke" id="candleSmoke"></div>
      </div>

      <div style="font-size:12px; color:var(--gold); margin-bottom:24px; font-family:var(--font-mono); letter-spacing:0.04em;">
        ✦ TAP THE CANDLE FLAME TO MAKE A WISH ✦
      </div>

      <button id="btnReadWish" class="btn-primary" style="display:none;">
        Open Your Keepsake Letter 📜
      </button>
    </div>
  </section>

  <!-- SCENE 2: CORE LETTER & MEMORIES -->
  <section id="sceneLetter" class="wc-scene">
    <div class="glass-card">
      <div class="occasion-badge">For {{RECIPIENT_NAME}}</div>
      <h2 style="font-family:var(--font-serif); font-size:24px; margin-bottom:20px; color:#fff;">Written With Heart</h2>

      <div class="wc-prose-container">
        {{WISH_BODY}}
      </div>

      <div class="wc-quote-box">
        “{{WISH_QUOTE}}”
      </div>

      <div id="photosContainer" style="display:none; width:100%; margin-top:20px;">
        <div style="font-size:12px; color:var(--gold); font-family:var(--font-mono); margin-bottom:12px; text-transform:uppercase; letter-spacing:0.06em;">Captured Moments</div>
        <div class="photos-strip" id="photosStrip"></div>
      </div>

      <div class="signature-block">
        <span>Always,</span>
        <span style="color:#fff; font-weight:600;">{{SENDER_NAME}}</span>
      </div>

      <div style="margin-top:28px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.08); display:flex; justify-content:center; gap:12px;">
        <button id="btnReplay" class="btn-primary" style="background:rgba(255,255,255,0.06); color:#fff; border:1px solid rgba(255,255,255,0.16); box-shadow:none;">
          ↺ Replay Moment
        </button>
      </div>
    </div>
  </section>

  <!-- WATERMARK -->
  <a href="https://wishcraft-12.netlify.app" target="_blank" class="wc-watermark" id="wcWatermark">
    Crafted with <span>WishCraft</span>
  </a>

</main>

<script>
(function() {
  const candleStage = document.getElementById('candleStage');
  const candleFlame = document.getElementById('candleFlame');
  const candleSmoke = document.getElementById('candleSmoke');
  const btnReadWish = document.getElementById('btnReadWish');
  const sceneHero = document.getElementById('sceneHero');
  const sceneLetter = document.getElementById('sceneLetter');
  const btnReplay = document.getElementById('btnReplay');
  const photosContainer = document.getElementById('photosContainer');
  const photosStrip = document.getElementById('photosStrip');

  let blownOut = false;

  // Render User Photos if supplied
  try {
    const rawPhotos = '{{USER_PHOTOS_JSON}}';
    const photos = JSON.parse(rawPhotos);
    if (Array.isArray(photos) && photos.length > 0) {
      photosContainer.style.display = 'block';
      photos.forEach(src => {
        if (!src) return;
        const img = document.createElement('img');
        img.className = 'photo-thumb';
        img.src = src;
        img.alt = 'Memory';
        photosStrip.appendChild(img);
      });
    }
  } catch(e) {}

  // Blow out candle
  candleStage.addEventListener('click', () => {
    if (blownOut) return;
    blownOut = true;

    candleFlame.classList.add('extinguished');
    candleSmoke.classList.add('rise');

    // Launch Confetti Burst
    try {
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#d4af6a', '#ffd32a', '#ffffff', '{{THEME_COLOR}}']
      });
      setTimeout(() => {
        confetti({
          particleCount: 60,
          angle: 60,
          spread: 55,
          origin: { x: 0 }
        });
        confetti({
          particleCount: 60,
          angle: 120,
          spread: 55,
          origin: { x: 1 }
        });
      }, 300);
    } catch(err) {}

    btnReadWish.style.display = 'inline-flex';
    btnReadWish.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  // Switch to Letter
  btnReadWish.addEventListener('click', () => {
    sceneHero.classList.remove('active');
    setTimeout(() => {
      sceneLetter.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 200);
  });

  // Replay
  btnReplay.addEventListener('click', () => {
    sceneLetter.classList.remove('active');
    blownOut = false;
    candleFlame.classList.remove('extinguished');
    candleSmoke.classList.remove('rise');
    btnReadWish.style.display = 'none';
    setTimeout(() => {
      sceneHero.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 200);
  });
})();
</script>
</body>
</html>
