<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{WISH_TITLE}} — WishCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root {
  --bg-primary: #060810;
  --theme: {{THEME_COLOR}};
  --theme-glow: {{THEME_COLOR}}33;
  --sapphire: #0984e3;
  --rose: #e84393;
  --cream: #f6f3eb;
  --cream-dim: rgba(246,243,235,0.7);
  --glass-bg: rgba(13, 20, 36, 0.7);
  --glass-border: rgba(255, 255, 255, 0.12);
  --font-serif: 'Fraunces', Georgia, serif;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background-color: var(--bg-primary);
  color: var(--cream);
  font-family: var(--font-sans);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}

.ambient-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.glow-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(130px);
  opacity: 0.28;
  animation: floatOrb 22s ease-in-out infinite alternate;
}
.orb-1 { width: 500px; height: 500px; background: #0984e3; top: -10%; left: -10%; }
.orb-2 { width: 450px; height: 450px; background: #e056fd; bottom: -15%; right: -10%; animation-delay: -10s; }

@keyframes floatOrb {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(40px, 30px) scale(1.1); }
  100% { transform: translate(-30px, 50px) scale(0.95); }
}

.wc-viewport {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 680px;
  min-height: 100vh;
  padding: 40px 20px 80px 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.wc-scene {
  width: 100%;
  display: none;
  opacity: 0;
  transform: translateY(20px) scale(0.98);
  transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.wc-scene.active {
  display: flex;
  flex-direction: column;
  align-items: center;
  opacity: 1;
  transform: translateY(0) scale(1);
}

.glass-card {
  width: 100%;
  background: var(--glass-bg);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid var(--glass-border);
  border-radius: 28px;
  padding: 40px 32px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.15);
  text-align: center;
  position: relative;
  overflow: hidden;
}

.occasion-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(9, 132, 227, 0.12);
  border: 1px solid rgba(9, 132, 227, 0.3);
  padding: 6px 16px;
  border-radius: 30px;
  font-size: 12px;
  font-family: var(--font-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #74b9ff;
  margin-bottom: 24px;
}

.hero-title {
  font-family: var(--font-serif);
  font-size: clamp(32px, 6vw, 44px);
  font-weight: 600;
  line-height: 1.15;
  color: #ffffff;
  margin-bottom: 14px;
  letter-spacing: -0.02em;
}
.hero-subtitle {
  font-size: clamp(14px, 2.5vw, 16px);
  color: var(--cream-dim);
  line-height: 1.6;
  max-width: 480px;
  margin: 0 auto 32px auto;
  font-weight: 300;
}

/* Biometric Liquid Ring */
.scan-ring-container {
  width: 110px;
  height: 110px;
  margin: 10px auto 30px auto;
  position: relative;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.scan-ring-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}
.scan-ring-bg {
  fill: none;
  stroke: rgba(255,255,255,0.08);
  stroke-width: 4;
}
.scan-ring-fill {
  fill: none;
  stroke: #74b9ff;
  stroke-width: 4;
  stroke-dasharray: 283;
  stroke-dashoffset: 283;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.1s linear;
  filter: drop-shadow(0 0 8px rgba(116, 185, 255, 0.8));
}
.scan-center-icon {
  font-size: 32px;
  user-select: none;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: linear-gradient(135deg, #0984e3, #74b9ff);
  color: #060810;
  font-weight: 600;
  font-size: 14.5px;
  padding: 14px 32px;
  border-radius: 40px;
  border: none;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(9, 132, 227, 0.4);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 36px rgba(9, 132, 227, 0.5);
}

.wc-prose-container {
  text-align: left;
  line-height: 1.85;
  font-size: 15px;
  color: var(--cream);
  margin-bottom: 28px;
}
.wc-prose-p { margin-bottom: 18px; font-weight: 300; }
.wc-quote-box {
  background: rgba(9, 132, 227, 0.08);
  border-left: 2px solid #0984e3;
  padding: 16px 20px;
  border-radius: 0 14px 14px 0;
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 15px;
  color: #fff;
  margin: 24px 0;
}
.signature-block {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  font-family: var(--font-serif);
  font-size: 16px;
  color: #74b9ff;
  margin-top: 24px;
}

.photos-strip {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding: 10px 0 20px 0;
  width: 100%;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.photos-strip::-webkit-scrollbar { display: none; }
.photo-thumb {
  width: 130px;
  height: 170px;
  object-fit: cover;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.15);
  flex-shrink: 0;
  box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}

.wc-watermark {
  margin-top: 40px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 20px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  font-size: 11px;
  color: var(--cream-dim);
  text-decoration: none;
}
.wc-watermark span { color: #74b9ff; font-weight: 600; }
</style>
</head>
<body>

<div class="ambient-glow">
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
</div>

<main class="wc-viewport">
  <section id="sceneHero" class="wc-scene active">
    <div class="glass-card">
      <div class="occasion-badge">🌹 Sapphire Romance Vault</div>
      <h1 class="hero-title">{{WISH_TITLE}}</h1>
      <p class="hero-subtitle">{{WISH_SUBTITLE}}</p>

      <div class="scan-ring-container" id="scanStage" title="Hold down to unlock the vault">
        <svg class="scan-ring-svg" viewBox="0 0 100 100">
          <circle class="scan-ring-bg" cx="50" cy="50" r="45"></circle>
          <circle class="scan-ring-fill" id="scanFill" cx="50" cy="50" r="45"></circle>
        </svg>
        <div class="scan-center-icon">🔒</div>
      </div>

      <div style="font-size:12px; color:#74b9ff; margin-bottom:24px; font-family:var(--font-mono); letter-spacing:0.04em;">
        ✦ HOLD TO DECRYPT AND UNLOCK ✦
      </div>

      <button id="btnReadWish" class="btn-primary" style="display:none;">
        Open Vault Letter ✨
      </button>
    </div>
  </section>

  <section id="sceneLetter" class="wc-scene">
    <div class="glass-card">
      <div class="occasion-badge">For {{RECIPIENT_NAME}}</div>
      <h2 style="font-family:var(--font-serif); font-size:24px; margin-bottom:20px; color:#fff;">Written In The Stars</h2>

      <div class="wc-prose-container">
        {{WISH_BODY}}
      </div>

      <div class="wc-quote-box">
        “{{WISH_QUOTE}}”
      </div>

      <div id="photosContainer" style="display:none; width:100%; margin-top:20px;">
        <div style="font-size:12px; color:#74b9ff; font-family:var(--font-mono); margin-bottom:12px; text-transform:uppercase; letter-spacing:0.06em;">Special Memories</div>
        <div class="photos-strip" id="photosStrip"></div>
      </div>

      <div class="signature-block">
        <span>With all my love,</span>
        <span style="color:#fff; font-weight:600;">{{SENDER_NAME}}</span>
      </div>

      <div style="margin-top:28px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.08); display:flex; justify-content:center; gap:12px;">
        <button id="btnReplay" class="btn-primary" style="background:rgba(255,255,255,0.06); color:#fff; border:1px solid rgba(255,255,255,0.16); box-shadow:none;">
          ↺ Relock Vault
        </button>
      </div>
    </div>
  </section>

  <a href="https://wishcraft-12.netlify.app" target="_blank" class="wc-watermark" id="wcWatermark">
    Crafted with <span>WishCraft</span>
  </a>
</main>

<script>
(function() {
  const scanStage = document.getElementById('scanStage');
  const scanFill = document.getElementById('scanFill');
  const btnReadWish = document.getElementById('btnReadWish');
  const sceneHero = document.getElementById('sceneHero');
  const sceneLetter = document.getElementById('sceneLetter');
  const btnReplay = document.getElementById('btnReplay');
  const photosContainer = document.getElementById('photosContainer');
  const photosStrip = document.getElementById('photosStrip');

  let unlocked = false;
  let holdTimer = null;
  let progress = 0;
  const totalCircumference = 283;

  try {
    const rawPhotos = '{{USER_PHOTOS_JSON}}';
    const photos = JSON.parse(rawPhotos);
    if (Array.isArray(photos) && photos.length > 0) {
      photosContainer.style.display = 'block';
      photos.forEach(src => {
        if (!src) return;
        const img = document.createElement('img');
        img.className = 'photo-thumb';
        img.src = src;
        img.alt = 'Memory';
        photosStrip.appendChild(img);
      });
    }
  } catch(e) {}

  function startHold(e) {
    if (unlocked) return;
    if (e.cancelable) e.preventDefault();
    progress = 0;
    scanFill.style.strokeDashoffset = totalCircumference;

    clearInterval(holdTimer);
    holdTimer = setInterval(() => {
      progress += 4;
      const offset = totalCircumference - (totalCircumference * (progress / 100));
      scanFill.style.strokeDashoffset = Math.max(0, offset);

      if (progress >= 100) {
        clearInterval(holdTimer);
        completeUnlock();
      }
    }, 30);
  }

  function cancelHold() {
    if (unlocked) return;
    clearInterval(holdTimer);
    progress = 0;
    scanFill.style.strokeDashoffset = totalCircumference;
  }

  function completeUnlock() {
    unlocked = true;
    scanStage.querySelector('.scan-center-icon').textContent = '🔓';

    try {
      confetti({
        particleCount: 90,
        spread: 65,
        origin: { y: 0.6 },
        colors: ['#0984e3', '#74b9ff', '#ffffff', '#e056fd']
      });
    } catch(err) {}

    btnReadWish.style.display = 'inline-flex';
    btnReadWish.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  scanStage.addEventListener('mousedown', startHold);
  window.addEventListener('mouseup', cancelHold);
  scanStage.addEventListener('touchstart', startHold, { passive: false });
  window.addEventListener('touchend', cancelHold);
  window.addEventListener('touchcancel', cancelHold);

  btnReadWish.addEventListener('click', () => {
    sceneHero.classList.remove('active');
    setTimeout(() => {
      sceneLetter.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 200);
  });

  btnReplay.addEventListener('click', () => {
    sceneLetter.classList.remove('active');
    unlocked = false;
    scanStage.querySelector('.scan-center-icon').textContent = '🔒';
    scanFill.style.strokeDashoffset = totalCircumference;
    btnReadWish.style.display = 'none';
    setTimeout(() => {
      sceneHero.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 200);
  });
})();
</script>
</body>
</html>
