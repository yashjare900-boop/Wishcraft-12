<style>
  :root{
    --bg:#0B0C10; --gold:#D4AF6A; --gold-dim:#8a7346; --cream:#F5F0E6; --cream-dim:#A8A296;
    --line:rgba(255,255,255,0.14);
    --glass: rgba(255,255,255,0.06);
    --glass-2: rgba(255,255,255,0.10);
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; font-family:var(--sans); overflow:hidden;
    background:
      radial-gradient(circle at 15% 20%, rgba(212,175,106,0.10), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(80,90,140,0.16), transparent 50%),
      radial-gradient(circle at 25% 85%, rgba(60,50,90,0.18), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(20,60,60,0.14), transparent 50%),
      linear-gradient(135deg, #0B0C10 0%, #111319 40%, #0B0C10 100%);
    background-size: 200% 200%, 200% 200%, 200% 200%, 200% 200%, 100% 100%;
    animation: liquidShiftDark 26s ease-in-out infinite;
    perspective: 1000px;
    -webkit-font-smoothing: antialiased;
  }
  @keyframes liquidShiftDark{
    0%{ background-position: 0% 0%, 100% 0%, 0% 100%, 100% 100%, 0% 0%; }
    50%{ background-position: 100% 100%, 0% 100%, 100% 0%, 0% 0%, 0% 0%; }
    100%{ background-position: 0% 0%, 100% 0%, 0% 100%, 100% 100%, 0% 0%; }
  }

  /* ================= AMBIENT PARTICLES (stars / fireflies) ================= */
  #ambient{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .mote{
    position:absolute; border-radius:50%; background:var(--gold);
    opacity:0; box-shadow:0 0 6px 1px rgba(212,175,106,0.6);
    animation: moteFloat linear infinite;
  }
  @keyframes moteFloat{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    8%{ opacity:0.7; }
    92%{ opacity:0.4; }
    100%{ transform:translateY(-110vh) translateX(var(--drift)); opacity:0; }
  }

  /* ================= BIRDS (subtle flourish) ================= */
  #birds{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .bird{
    position:absolute; width:34px; height:14px; opacity:0;
    animation: birdFly linear infinite;
  }
  .bird svg{ width:100%; height:100%; display:block; }
  .bird path{ animation: flap 0.55s ease-in-out infinite; transform-origin:center; }
  @keyframes flap{ 0%,100%{ transform:scaleY(1); } 50%{ transform:scaleY(0.35); } }
  @keyframes birdFly{
    0%{ transform:translate(-10vw, 0) scale(0.7); opacity:0; }
    10%{ opacity:0.55; }
    90%{ opacity:0.4; }
    100%{ transform:translate(115vw, -18vh) scale(1.1); opacity:0; }
  }

  /* ================= LOADING SCREEN ================= */
  #loadScreen{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:30px; z-index:900;
    background: var(--bg);
    transition: opacity 0.4s ease, filter 0.4s ease;
  }
  #loadScreen.fade-out{ opacity:0; filter:blur(12px); pointer-events:none; }

  .orb-wrap{ position:relative; width:150px; height:150px; display:flex; align-items:center; justify-content:center; }
  .orb-ring{
    position:absolute; inset:0; border-radius:50%;
    border:1.5px solid transparent;
    border-top-color: var(--gold);
    border-right-color: rgba(212,175,106,0.25);
    filter: drop-shadow(0 0 10px rgba(212,175,106,0.5));
    animation: spin 2.6s cubic-bezier(0.6,0.1,0.4,0.9) infinite;
  }
  .orb-ring.r2{ inset:16px; border-top-color:transparent; border-left-color:var(--gold); animation-duration:3.6s; animation-direction:reverse; opacity:0.7; }
  .orb-ring.r3{ inset:32px; border-top-color:rgba(212,175,106,0.6); border-bottom-color:transparent; animation-duration:2.9s; opacity:0.5; }
  .orb-ring.r4{ inset:-14px; border-top-color:rgba(212,175,106,0.35); border-left-color:transparent; animation-duration:4.6s; opacity:0.4; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .orb-core{
    width:50px; height:50px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff2d6, var(--gold) 55%, #7a5f34 100%);
    box-shadow: 0 0 30px rgba(212,175,106,0.65), 0 0 60px rgba(212,175,106,0.25);
    animation: pulse 2.8s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(0.86); } }

  .orb-sparkle{
    position:absolute; width:3px; height:3px; border-radius:50%; background:#fff2d6;
    box-shadow:0 0 6px 1px rgba(255,242,214,0.9);
    animation: sparkleOrbit linear infinite;
  }
  @keyframes sparkleOrbit{
    from{ transform: rotate(0deg) translateX(75px) rotate(0deg); opacity:0; }
    10%{ opacity:1; }
    90%{ opacity:1; }
    to{ transform: rotate(360deg) translateX(75px) rotate(-360deg); opacity:0; }
  }

  #loadLabel{
    color:var(--cream); font-size:13.5px; letter-spacing:0.18em; text-transform:uppercase;
    font-weight:600; opacity:0.9; text-align:center; min-height:18px;
  }
  #loadSub{ color:var(--cream-dim); font-size:11.5px; letter-spacing:0.04em; margin-top:-18px; text-align:center; padding:0 30px; min-height:16px; transition:opacity 0.5s ease; }
  #loadBarTrack{
    width:180px; height:3px; border-radius:99px; background:rgba(255,255,255,0.08);
    overflow:hidden; margin-top:-6px;
  }
  #loadBarFill{
    width:0%; height:100%; border-radius:99px;
    background:linear-gradient(90deg, var(--gold-dim), var(--gold));
    box-shadow:0 0 8px rgba(212,175,106,0.6);
    transition: width 0.35s ease;
  }

  /* ================= GATE SCREEN ================= */
  #gateScreen{
    position:fixed; inset:0; align-items:center; justify-content:center;
    padding:20px; opacity:0; visibility:hidden; z-index:999;
    display:flex; pointer-events:none;
    transition: opacity 0.4s cubic-bezier(0.16,1,0.3,1), visibility 0.4s ease;
  }
  #gateScreen.visible{ opacity:1; visibility:visible; pointer-events:auto; }

  #gateBox{
    width:min(380px, 100%); background:var(--glass); border:1px solid var(--line);
    border-radius:28px; padding:38px 30px; text-align:center;
    backdrop-filter:blur(30px) saturate(150%); -webkit-backdrop-filter:blur(30px) saturate(150%);
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    transform-style: preserve-3d;
    animation: floatIn 0.8s cubic-bezier(0.16,1,0.3,1) both;
    position:relative;
  }
  @keyframes floatIn{
    from{ opacity:0; transform: translateY(28px) scale(0.93) rotateX(7deg); }
    to{ opacity:1; transform: translateY(0) scale(1) rotateX(0deg); }
  }
  #gateBox.shake{ animation: shakeErr 0.55s ease; }
  @keyframes shakeErr{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-10px); }
    40%{ transform:translateX(9px); }
    60%{ transform:translateX(-6px); }
    80%{ transform:translateX(4px); }
  }

  #gateIcon{
    width:58px; height:58px; margin:0 auto 20px; border-radius:50%;
    background:var(--glass-2); border:1px solid var(--gold-dim); display:flex; align-items:center; justify-content:center;
    color:var(--gold); font-size:24px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
    transition: transform 0.7s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.7s ease;
  }
  #gateIcon.unlocked{
    transform: scale(1.18) rotate(-10deg);
    box-shadow: 0 0 34px rgba(212,175,106,0.75), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  #gateBox h1{ color:var(--cream); font-size:18px; font-weight:600; margin:0 0 8px; letter-spacing:-0.2px; }
  #gateBox p{ color:var(--cream-dim); font-size:12.5px; margin:0 0 24px; line-height:1.5; }
  #gatePassword{
    width:100%; padding:14px 16px; border-radius:14px; border:1px solid var(--line);
    background:rgba(0,0,0,0.25); color:var(--cream); font-size:16px; margin-bottom:14px;
    outline:none; font-family:var(--sans); letter-spacing:0.5px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
    transition: box-shadow .2s ease, border-color .2s ease;
  }
  #gatePassword:focus{ border-color:var(--gold-dim); box-shadow: 0 0 0 4px rgba(212,175,106,0.18), inset 0 1px 3px rgba(0,0,0,0.4); }
  #gateSubmit{
    width:100%; padding:15px 16px; border-radius:99px; border:none;
    background:linear-gradient(135deg, var(--gold), #a9854c); color:#0B0C10; font-weight:700; font-size:14px; cursor:pointer;
    letter-spacing:0.3px; box-shadow: 0 8px 24px rgba(212,175,106,0.3), inset 0 1px 0 rgba(255,255,255,0.25);
    transition: transform .15s ease, filter .15s ease, background .4s ease;
    position:relative; overflow:hidden;
  }
  #gateSubmit:disabled{ opacity:0.85; cursor:default; }
  #gateSubmit:hover:not(:disabled){ filter:brightness(1.08); transform:translateY(-1px); }
  #gateSubmit.success{ background:linear-gradient(135deg, #6fcf97, #4a9a6a); }
  #gateError{ color:#e88; font-size:12px; margin-top:12px; min-height:14px; }
  #gateHint{ color:#666; font-size:11px; margin-top:16px; }

  /* ================= UNLOCK TRANSITION ================= */
  #unlockOverlay{
    position:fixed; inset:0; z-index:600; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    opacity:0;
  }
  #unlockOverlay.playing{ opacity:1; }

  .burst-ring{
    position:absolute; width:16px; height:16px; border-radius:50%;
    border:2px solid var(--gold); opacity:0;
  }
  #unlockOverlay.playing .burst-ring{
    animation: burstOut 1.9s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .burst-ring.b2{ animation-delay:0.18s !important; border-color:rgba(212,175,106,0.55); }
  .burst-ring.b3{ animation-delay:0.36s !important; border-color:rgba(255,255,255,0.35); }
  @keyframes burstOut{
    0%{ width:16px; height:16px; opacity:0.9; }
    100%{ width:1600px; height:1600px; opacity:0; }
  }

  .shard{
    position:absolute; width:5px; height:5px; border-radius:1px;
    background: var(--gold); opacity:0; top:50%; left:50%;
  }
  #unlockOverlay.playing .shard{ animation: shardFly 1.8s cubic-bezier(0.19,1,0.22,1) forwards; }
  @keyframes shardFly{
    0%{ opacity:1; transform: translate(-50%,-50%) rotate(var(--rot)) translateY(0) scale(1); }
    100%{ opacity:0; transform: translate(-50%,-50%) rotate(var(--rot)) translateY(var(--dist)) scale(0.15); }
  }

  #frameStage{ position:fixed; inset:0; width:100%; height:100%; perspective: 1800px; z-index:10; }
  #viewerFrame{
    position:fixed; inset:0; width:100%; height:100%; border:none; display:none;
    transform-origin: center center;
    backface-visibility: hidden;
  }
  #viewerFrame.reveal{
    display:block;
    animation: frameReveal 1.8s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes frameReveal{
    0%{
      opacity:0;
      transform: scale(0.85) rotateX(-10deg) translateY(30px);
      filter: blur(14px) brightness(1.5);
    }
    45%{
      opacity:1;
      filter: blur(3px) brightness(1.1);
    }
    100%{
      opacity:1;
      transform: scale(1) rotateX(0deg) translateY(0);
      filter: blur(0) brightness(1);
    }
  }

  #flashPulse{
    position:fixed; inset:0; z-index:590; background:#fff; opacity:0; pointer-events:none;
  }
  #flashPulse.flash{ animation: flashPulse 1.1s ease-out forwards; }
  @keyframes flashPulse{
    0%{ opacity:0; }
    16%{ opacity:0.5; }
    100%{ opacity:0; }
  }

  #stateMsg{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    color:var(--cream); font-size:15px; text-align:center; padding:30px; z-index:1000;
    line-height: 1.6; letter-spacing: 0.02em; background: rgba(11, 12, 16, 0.88); backdrop-filter: blur(14px);
  }

  @media (max-width:480px){
    #gateBox{ padding:32px 24px; border-radius:24px; }
    .orb-wrap{ width:100px; height:100px; }
    .orb-core{ width:38px; height:38px; }
    #loadLabel{ font-size:12px; }
  }
</style>
</head>
<body>

  <div id="ambient"></div>
  <div id="birds"></div>

  <div id="stateMsg"></div>

  <div id="loadScreen">
    <div class="orb-wrap">
      <div class="orb-ring r1"></div>
      <div class="orb-ring r2"></div>
      <div class="orb-ring r3"></div>
      <div class="orb-ring r4"></div>
      <div class="orb-core"></div>
    </div>
    <div id="loadLabel">Preparing your gift</div>
    <div id="loadSub">A little something is being wrapped for you</div>
    <div id="loadBarTrack"><div id="loadBarFill"></div></div>
  </div>

  <div id="gateScreen">
    <div id="gateBox">
      <div id="gateIcon">&#10022;</div>
      <h1>This is a private gift</h1>
      <p>Enter the password you were given to open it.</p>
      <input type="password" id="gatePassword" placeholder="Password" autocomplete="off" />
      <button id="gateSubmit">Unlock Gift</button>
      <div id="gateError"></div>
      <div id="gateHint">Don't have a password? Ask whoever sent you this link.</div>
    </div>
  </div>

  <div id="flashPulse"></div>

  <div id="unlockOverlay">
    <div class="burst-ring b1"></div>
    <div class="burst-ring b2"></div>
    <div class="burst-ring b3"></div>
  </div>

  <div id="frameStage">
    <iframe id="viewerFrame" title="Your gift" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  const WishCrypto = {
    b642buf: (str) => Uint8Array.from(atob(str), c => c.charCodeAt(0)),
    async deriveKey(password, salt) {
      const keyMaterial = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    },
    async decrypt(payload, password) {
      const salt = this.b642buf(payload.salt);
      const iv = this.b642buf(payload.iv);
      const ciphertext = this.b642buf(payload.ciphertext);
      const key = await this.deriveKey(password, salt);
      const decryptedBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ciphertext);
      return new TextDecoder().decode(decryptedBuf);
    }
  };

  const firebaseConfig = {
    apiKey: "AIzaSyByEAwr9i5ijcRA1a2z-FsUinwENmnEfQA",
    authDomain: "wishcraft-1cad2.firebaseapp.com",
    projectId: "wishcraft-1cad2",
    storageBucket: "wishcraft-1cad2.firebasestorage.app",
    messagingSenderId: "117932063613",
    appId: "1:117932063613:web:c2c350effa4dc7ca2eea14"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const loadScreen = document.getElementById('loadScreen');
  const stateMsg = document.getElementById('stateMsg');
  const gateScreen = document.getElementById('gateScreen');
  const gateBox = document.getElementById('gateBox');
  const gateIcon = document.getElementById('gateIcon');
  const gatePassword = document.getElementById('gatePassword');
  const gateSubmit = document.getElementById('gateSubmit');
  const gateError = document.getElementById('gateError');
  const viewerFrame = document.getElementById('viewerFrame');
  const unlockOverlay = document.getElementById('unlockOverlay');
  const flashPulse = document.getElementById('flashPulse');
  const ambient = document.getElementById('ambient');
  const birdsWrap = document.getElementById('birds');

  const isMobile = window.innerWidth < 640;
  let activeTargetId = null;
  let activeGiftData = null;

  // ---- orbiting sparkles around the loading orb ----
  const orbWrap = document.querySelector('.orb-wrap');
  const sparkleCount = 5;
  for (let i = 0; i < sparkleCount; i++) {
    const sp = document.createElement('div');
    sp.className = 'orb-sparkle';
    sp.style.animationDuration = (3 + i * 0.6) + 's';
    sp.style.animationDelay = (i * 0.5) + 's';
    sp.style.left = '50%';
    sp.style.top = '50%';
    orbWrap.appendChild(sp);
  }

  // ---- staged loader copy + progress bar ----
  const loadLabel = document.getElementById('loadLabel');
  const loadSub = document.getElementById('loadSub');
  const loadBarFill = document.getElementById('loadBarFill');
  const loadStages = [
    { pct: 20, label: "Preparing your gift", sub: "A little something is being wrapped for you" },
    { pct: 50, label: "Tying the ribbon", sub: "Almost every detail is in place" },
    { pct: 75, label: "Adding the finishing touch", sub: "This one was made just for you" },
    { pct: 92, label: "Ready to open", sub: "Just a moment more" }
  ];
  let stageTimers = [];
  function runLoaderStages(){
    loadStages.forEach((s, i) => {
      const t = setTimeout(() => {
        if (loadBarFill) loadBarFill.style.width = s.pct + '%';
        if (loadSub) loadSub.style.opacity = '0';
        setTimeout(() => {
          if (loadLabel) loadLabel.textContent = s.label;
          if (loadSub) {
            loadSub.textContent = s.sub;
            loadSub.style.opacity = '1';
          }
        }, 200);
      }, i * 600);
      stageTimers.push(t);
    });
  }
  runLoaderStages();

  // ---- ambient floating motes (fireflies) ----
  const moteCount = isMobile ? 14 : 26;
  for (let i = 0; i < moteCount; i++) {
    const m = document.createElement('div');
    m.className = 'mote';
    const size = 1.5 + Math.random() * 2.5;
    m.style.width = size + 'px';
    m.style.height = size + 'px';
    m.style.left = Math.random() * 100 + 'vw';
    m.style.top = (60 + Math.random() * 40) + 'vh';
    m.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
    m.style.animationDuration = (14 + Math.random() * 14) + 's';
    m.style.animationDelay = (Math.random() * 14) + 's';
    ambient.appendChild(m);
  }

  // ---- subtle birds flourish ----
  const birdSvg = '<svg viewBox="0 0 34 14" xmlns="http://www.w3.org/2000/svg"><path d="M0 8 Q8 -2 17 8 Q26 -2 34 8" fill="none" stroke="rgba(212,175,106,0.55)" stroke-width="1.6" stroke-linecap="round"/></svg>';
  const birdCount = isMobile ? 2 : 4;
  for (let i = 0; i < birdCount; i++) {
    const b = document.createElement('div');
    b.className = 'bird';
    b.innerHTML = birdSvg;
    b.style.top = (10 + Math.random() * 30) + 'vh';
    b.style.animationDuration = (18 + Math.random() * 10) + 's';
    b.style.animationDelay = (Math.random() * 20) + 's';
    birdsWrap.appendChild(b);
  }

  // build radial shards
  const shardCount = isMobile ? 14 : 22;
  for (let i = 0; i < shardCount; i++) {
    const s = document.createElement('div');
    s.className = 'shard';
    const rot = (360 / shardCount) * i;
    s.style.setProperty('--rot', rot + 'deg');
    s.style.setProperty('--dist', (-240 - Math.random() * 260) + 'px');
    unlockOverlay.appendChild(s);
  }

  const loaderStart = Date.now();
  const MIN_LOADER_MS = 600;

  function hideLoader(){
    stageTimers.forEach(t => clearTimeout(t));
    stageTimers = [];
    const elapsed = Date.now() - loaderStart;
    const wait = Math.max(0, MIN_LOADER_MS - elapsed);
    setTimeout(() => {
      if (loadBarFill) loadBarFill.style.width = '100%';
      if (loadSub) loadSub.style.opacity = '0';
      if (loadLabel) loadLabel.textContent = "Ready";
      setTimeout(() => {
        if (loadScreen) {
          loadScreen.classList.add('fade-out');
          setTimeout(() => {
            loadScreen.style.display = 'none';
          }, 350);
        }
      }, 120);
    }, wait);
  }

  function showState(msg){
    hideLoader();
    stateMsg.textContent = msg;
    stateMsg.style.display = 'flex';
  }

  function showErrorState(msg, attemptedId) {
    hideLoader();
    stateMsg.innerHTML = `
      <div style="background:var(--glass); border:1px solid var(--line); border-radius:24px; padding:36px 28px; max-width:440px; width:92%; text-align:center; backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px); box-shadow:0 24px 70px rgba(0,0,0,0.6); position:relative; z-index:100;">
        <div style="width:58px; height:58px; margin:0 auto 16px; border-radius:50%; background:rgba(238,136,136,0.15); border:1px solid rgba(238,136,136,0.4); display:flex; align-items:center; justify-content:center; font-size:24px; color:#e88;">⚠️</div>
        <h2 style="color:var(--cream); font-family:var(--serif); font-size:20px; margin:0 0 10px; font-weight:600;">Connection Issue</h2>
        <p style="color:var(--cream-dim); font-size:13.5px; line-height:1.55; margin:0 0 20px;">${msg}</p>
        <button id="retryLoadBtn" style="padding:12px 26px; border-radius:99px; border:none; background:linear-gradient(135deg, var(--gold), #a9854c); color:#0B0C10; font-weight:700; font-size:13.5px; cursor:pointer;">Retry</button>
      </div>
    `;
    stateMsg.style.display = 'flex';
    document.getElementById('retryLoadBtn')?.addEventListener('click', () => {
      stateMsg.style.display = 'none';
      loadScreen.style.display = 'flex';
      loadScreen.classList.remove('fade-out');
      loadGift(attemptedId);
    });
  }

  function showNotFoundState(attemptedId) {
    hideLoader();
    stateMsg.innerHTML = `
      <div style="background:var(--glass); border:1px solid var(--line); border-radius:24px; padding:36px 28px; max-width:440px; width:92%; text-align:center; backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px); box-shadow:0 24px 70px rgba(0,0,0,0.6); position:relative; z-index:100;">
        <div style="width:58px; height:58px; margin:0 auto 16px; border-radius:50%; background:rgba(238,136,136,0.15); border:1px solid rgba(238,136,136,0.4); display:flex; align-items:center; justify-content:center; font-size:24px; color:#e88;">🔍</div>
        <h2 style="color:var(--cream); font-family:var(--serif); font-size:20px; margin:0 0 10px; font-weight:600;">Gift Not Found</h2>
        <p style="color:var(--cream-dim); font-size:13.5px; line-height:1.55; margin:0 0 20px;">
          This gift link doesn't exist or may have expired.<br/>
          <span style="font-family:monospace; font-size:12px; color:var(--gold-dim); word-break:break-all;">ID: ${attemptedId || ''}</span>
        </p>
      </div>
    `;
    stateMsg.style.display = 'flex';
  }

  async function sha256Hex(text){
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  function playUnlockTransition(html){
    // Stage 1: icon glow + button success
    gateIcon.classList.add('unlocked');
    gateSubmit.classList.add('success');
    gateSubmit.textContent = "Unlocked";

    // Stage 2: flash + burst + shard particles, gate dissolves
    setTimeout(() => {
      flashPulse.classList.add('flash');
      unlockOverlay.classList.add('playing');
      gateScreen.style.transition = 'opacity 0.9s ease, transform 1s cubic-bezier(0.4,0,0.2,1)';
      gateScreen.style.opacity = '0';
      gateScreen.style.transform = 'scale(0.9)';
    }, 750);

    // Stage 3: gate removed, gift frame flies in with 3D reveal
    setTimeout(() => {
      gateScreen.classList.remove('visible');
      viewerFrame.srcdoc = html;
      viewerFrame.classList.add('reveal');
    }, 1300);

    // Stage 4: cleanup particle layer + stop ambient birds/fireflies
    setTimeout(() => {
      unlockOverlay.classList.remove('playing');
      ambient.style.transition = 'opacity 0.6s ease';
      birdsWrap.style.transition = 'opacity 0.6s ease';
      ambient.style.opacity = '0';
      birdsWrap.style.opacity = '0';
      setTimeout(() => {
        try { ambient.remove(); birdsWrap.remove(); } catch(e){}
      }, 650);
    }, 3300);
  }

  function unwrapFirestoreValue(val) {
    if (!val) return null;
    if ('stringValue' in val) return val.stringValue;
    if ('booleanValue' in val) return val.booleanValue;
    if ('integerValue' in val) return parseInt(val.integerValue, 10);
    if ('doubleValue' in val) return parseFloat(val.doubleValue);
    if ('timestampValue' in val) return val.timestampValue;
    if ('nullValue' in val) return null;
    if ('mapValue' in val) {
      const res = {};
      const fields = val.mapValue.fields || {};
      for (const k in fields) res[k] = unwrapFirestoreValue(fields[k]);
      return res;
    }
    if ('arrayValue' in val) {
      return (val.arrayValue.values || []).map(unwrapFirestoreValue);
    }
    return val;
  }

  function unwrapFirestoreDoc(docObj) {
    if (!docObj || !docObj.fields) return null;
    const res = {};
    for (const k in docObj.fields) {
      res[k] = unwrapFirestoreValue(docObj.fields[k]);
    }
    return res;
  }

  async function fetchDocRest(targetId) {
    const url = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/published_pages/${encodeURIComponent(targetId)}?key=${firebaseConfig.apiKey}`;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 6000);
    try {
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(timer);
      if (res.status === 404) return { exists: false, data: null };
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
      const json = await res.json();
      return { exists: true, data: unwrapFirestoreDoc(json) };
    } catch(err) {
      clearTimeout(timer);
      throw err;
    }
  }

  async function loadGift(targetId) {
    if (!targetId) {
      showState("No gift ID was provided in the link. Please verify the URL.");
      return;
    }

    try { localStorage.setItem('wishcraft_last_doc_id', targetId); } catch(e){}

    let data = null;
    let exists = false;
    let loadFailed = false;

    try {
      // Direct REST API (fastest, guaranteed not blocked by WebSocket/gRPC restrictions)
      const restPromise = fetchDocRest(targetId);
      const sdkPromise = new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error("SDK Timeout")), 4000);
        getDoc(doc(db, "published_pages", targetId)).then(snap => {
          clearTimeout(timer);
          if (!snap.exists()) resolve({ exists: false, data: null });
          else resolve({ exists: true, data: snap.data() });
        }).catch(err => {
          clearTimeout(timer);
          reject(err);
        });
      });

      // Race REST and SDK - Promise.any takes whichever fulfills first
      const res = await Promise.any([restPromise, sdkPromise]);
      exists = res.exists;
      data = res.data;
    } catch (err) {
      console.warn("Primary fetch failed, attempting direct REST fallback:", err);
      try {
        const fallback = await fetchDocRest(targetId);
        exists = fallback.exists;
        data = fallback.data;
      } catch (finalErr) {
        console.error("All fetch attempts failed:", finalErr);
        loadFailed = true;
      }
    }

    if (loadFailed) {
      showErrorState("Unable to load gift. Please check your internet connection or try again.", targetId);
      return;
    }

    if (!exists || !data) {
      showNotFoundState(targetId);
      return;
    }

    // Custom wish title
    if (data && data.title) {
      document.title = `${data.title} | WishCraft ✨`;
      const gateH1 = gateBox.querySelector('h1');
      if (gateH1) gateH1.textContent = data.title;
    }

    activeTargetId = targetId;
    activeGiftData = data;

    hideLoader();

    if (!data.isEncrypted && !data.passwordHash) {
      viewerFrame.srcdoc = data.html;
      viewerFrame.classList.add('reveal');
      setTimeout(() => {
        try { ambient.remove(); birdsWrap.remove(); } catch(e){}
      }, 2600);
      return;
    }

    gateScreen.classList.add('visible');

    async function attemptUnlock(){
      const val = gatePassword.value;
      if (!val) { gateError.textContent = "Please enter a password."; return; }
      gateSubmit.disabled = true; gateSubmit.textContent = "Decrypting...";
      
      try {
        if (data.isEncrypted) {
           const decryptedHtml = await WishCrypto.decrypt(data.encryptedData, val);
           gateError.textContent = "";
           playUnlockTransition(decryptedHtml);
        } else if (data.passwordHash) {
           const hash = await sha256Hex(val);
           if (hash === data.passwordHash) {
             gateError.textContent = "";
             playUnlockTransition(data.html);
           } else throw new Error("Wrong password");
        }
      } catch (err) {
        gateError.textContent = "Incorrect password. Try again.";
        gateBox.classList.remove('shake'); void gateBox.offsetWidth; gateBox.classList.add('shake');
        gateSubmit.disabled = false; gateSubmit.textContent = "Unlock Gift";
        gatePassword.value = '';
        gatePassword.focus();
      }
    }

    gateSubmit.onclick = attemptUnlock;
    gatePassword.onkeypress = (e) => { if (e.key === 'Enter') attemptUnlock(); };
  }

  function extractDocId() {
    let id = null;
    try {
      const searchParams = new URLSearchParams(window.location.search);
      id = searchParams.get('id');
      if (!id && window.location.hash) {
        const rawHash = window.location.hash.replace(/^#\??/, '');
        const hashParams = new URLSearchParams(rawHash);
        id = hashParams.get('id') || rawHash.split('&')[0];
      }
    } catch(e) {
      console.warn("Could not parse gift ID params:", e);
    }
    return (typeof id === 'string') ? id.trim() : null;
  }

  const docId = extractDocId();
  if (!docId) {
    showState("No gift ID was provided in the link. Please verify the URL.");
  } else {
    loadGift(docId);
  }
</script>
