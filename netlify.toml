[build]
  publish = "."

[[edge_functions]]
  path = "/api/generate"
  function = "generate"

[[edge_functions]]
  path = "/api/health"
  function = "health"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
